[package]
name = "bluesky-obfs"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "src/server_main.rs"
name = "server"

[[bin]]
path = "src/client_main.rs"
name = "client"

[lib]
path = "src/lib.rs"
name = "bsobfs"

[dependencies]
the-fourth-server = "0.4"
wreq = {version = "6.0.0-rc.31", features = ["tokio-rt"]}
wreq-util = {version = "3.0.0-rc.14", features = ["tokio-rt"]}
tokio = {version = "1", features = ["full"]}
httparse = "1.10"
tls-parser = "0.12"
nom = "7.1.3"
bytes = "0.4.12"
tokio-util = {version = "0.7", features = ["codec"]}
num_enum = "0.7"
rkyv = { version = "0.8", features = ["unaligned"] }
futures-util = "0.3.34"
spake2 = "0.4"
aes-gcm = "0.10.3"
aead = "0.5.2"
rand = "0.9.5"
hkdf = "0.12"