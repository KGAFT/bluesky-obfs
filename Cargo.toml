[package]
name = "bluesky-obfs"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "bsobfs"

[features]
# Debug logging on the connection path. Off by default: a release server must
# not write logins or record contents to stderr.
debug-logging = []

[dependencies]
wreq = {version = "6.0.0-rc.31", features = ["tokio-rt"]}
wreq-util = {version = "3.0.0-rc.14", features = ["tokio-rt"]}
tokio = {version = "1", features = ["full"]}
httparse = "1.10"
tls-parser = "0.12"
nom = "7.1.3"
bytes = "1.12"
tokio-util = {version = "0.7", features = ["codec"]}
num_enum = "0.7"
futures-util = "0.3.34"
spake2 = "0.4"
the-fourth-utils = {version = "0.1", features = ["encryption-util", "codec", "structure-type"]}
aes-gcm = "0.10.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true